# Minimal Apache config for the Slowloris testbed.
# prefork MPM with a deliberately small worker pool -> easy to exhaust.
ServerRoot "/usr/local/apache2"
Listen 80
ServerName victim

LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so

# --- The vulnerability we are studying -------------------------------------
# A small pool makes the exhaustion observable; mod_reqtimeout is intentionally
# NOT loaded for the baseline runs. experiments/run_all.sh can rebuild with it
# enabled (STATIC_DEFENSE=1) to measure the "static defense" comparison arm.
<IfModule mpm_prefork_module>
    StartServers           5
    MinSpareServers        5
    MaxSpareServers       10
    MaxRequestWorkers     50
    MaxConnectionsPerChild 0
</IfModule>
# ---------------------------------------------------------------------------

User daemon
Group daemon
DocumentRoot "/usr/local/apache2/htdocs"

# Generic read timeout. A live Slowloris EVADES it by trickling a header every
# ~12 s (< Timeout), so the connection survives and the pool is still exhausted
# -- i.e. this static control alone does not stop the attack. But once our
# detector isolates the attacker, the connections fall silent and this timeout
# reaps the orphaned sockets, letting the worker pool recover. (On a native
# Linux host the mitigator would instead force-close them via ss -K / SOCK_DESTROY;
# the WSL2 test kernel lacks that, so recovery relies on this reaper.)
Timeout 25

<Directory "/usr/local/apache2/htdocs">
    Require all granted
</Directory>

# server-status lets the detector read the live busy/idle worker count,
# which drives the adaptive threshold. Scraped only from inside the host.
<Location "/server-status">
    SetHandler server-status
    Require ip 127.0.0.1 172.28.0.0/16
</Location>
ExtendedStatus On

LogLevel warn
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 common
